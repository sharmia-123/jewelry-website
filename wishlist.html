<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wishlist - ISSAOU</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

  <style>
    *
    {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body
    {
      background-color: #fff3e3;
    }

    .navbar
    {
      width: 100%;
      height: 80px;
      background-color: #762E3F;
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
      padding: 0 30px;
    }

    .nav-lft
    {
      display: flex;
      flex-direction: column;
      align-items: center;
      user-select: none;
    }

    .logo
    {
      font-size: 30px;
      color: #fff3e3;
      font-weight: bold;
    }

    .sub-hdng
    {
      font-size: 20px;
      color: #fff3e3;
      text-align: center;
      font-family: cursive;
      user-select: none;
    }

    .nav-rgt
    {
      display: flex;
      flex-direction: row;
      gap: 20px;
    }

    .nav-rgt a
    {
      color: #fff3e3;
      text-decoration: none;
      font-size: 17px;
    }

    .wish-main
    {
      width: 100%;
      padding: 30px 20px;
    }

    .wish-hdng
    {
      text-align: center;
      font-size: 40px;
      color: #762E3F;
      font-family: cursive;
      margin-bottom: 30px;
    }

    .wish-items
    {
      width: 100%;
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
    }

    .prdct
    {
      width: 300px;
      background: white;
      border-radius: 15px;
      overflow: hidden;
    }

    .box
    {
      width: 100%;
      height: 290px;
    }

    .box img
    {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .prdct-dtls
    {
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .prdct-nm
    {
      font-size: 18px;
      color: #762E3F;
    }

    .prdct-prc
    {
      font-size: 18px;
      font-weight: bold;
    }

    .btn-rw
    {
      display: flex;
      flex-direction: row;
      gap: 10px;
    }

    .btn
    {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: #762E3F;
      color: #fff3e3;
      cursor: pointer;
    }

    .btn-red
    {
      background: #e63946;
    }

    .empty-txt
    {
      width: 100%;
      text-align: center;
      font-size: 20px;
      color: #762E3F;
      margin-top: 50px;
    }

    .back-btn
    {
      display: block;
      width: 200px;
      margin: 0 auto 20px auto;
      padding: 10px;
      background: #762E3F;
      color: #fff3e3;
      text-align: center;
      text-decoration: none;
      border-radius: 8px;
    }

    @media(max-width: 768px)
    {
      .prdct { width: 45%; }
    }

    @media(max-width: 480px)
    {
      .prdct { width: 100%; }
    }
  </style>
</head>

<body>
  <header>
    <div class="navbar">
      <div class="nav-lft">
        <div class="logo">ISSAOU</div>
        <div class="sub-hdng">for every you</div>
      </div>
      <div class="nav-rgt">
        <a href="index.html">Home</a>
        <a href="cart.html">
          <i class="fa-solid fa-cart-shopping"></i>
          <span id="cart-count">0</span>
        </a>
      </div>
    </div>
  </header>

  <div class="wish-main">
    <a href="index.html" class="back-btn">← Back to Shop</a>
    <div class="wish-hdng">Your Wishlist</div>
    <div class="wish-items" id="wish-container"></div>
  </div>

  <script>
    let wishlist = JSON.parse(localStorage.getItem('issaou_wishlist')) || [];
    let cart = JSON.parse(localStorage.getItem('issaou_cart')) || [];
    const container = document.getElementById('wish-container');

    function saveToStorage()
    {
      localStorage.setItem('issaou_wishlist', JSON.stringify(wishlist));
      localStorage.setItem('issaou_cart', JSON.stringify(cart));
    }

    function updateCounts()
    {
      const cartCountEl = document.getElementById('cart-count');
      if(cartCountEl) cartCountEl.innerText = cart.reduce((total, item) => total + item.qty, 0);
    }

    function renderWishlist()
    {
      container.innerHTML = '';
      if (wishlist.length === 0)
      {
        container.innerHTML = '<div class="empty-txt">Your wishlist is empty</div>';
        updateCounts();
        return;
      }

      wishlist.forEach((item) =>
      {
        container.innerHTML += `
          <div class="prdct">
            <div class="box"><img src="${item.img}"></div>
            <div class="prdct-dtls">
              <div class="prdct-nm">${item.name}</div>
              <div class="prdct-prc">Rs.${item.price.toLocaleString('en-IN')}</div>
              <div class="btn-rw">
                <button class="btn" onclick="moveToCart('${item.id}')">Add to Cart</button>
                <button class="btn btn-red" onclick="removeItem('${item.id}')">
                  <i class="fa-solid fa-trash"></i>
                </button>
              </div>
            </div>
          </div>
        `;
      });
      updateCounts();
    }

    function removeItem(id)
    {
      wishlist = wishlist.filter(p => p.id !== id);
      saveToStorage();
      renderWishlist();
    }

    function moveToCart(id)
    {
      const item = wishlist.find(p => p.id === id);
      const existing = cart.find(p => p.id === id);
      if (existing) existing.qty++;
      else cart.push({...item, qty: 1});
      removeItem(id);
      alert(item.name + ' moved to Cart!');
    }

    renderWishlist();
  </script>
</body>
</html>
